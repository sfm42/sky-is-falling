name: Update Doom Index

on:
  schedule:
    - cron: "17 * * * *"      # every hour, at :17 past (avoids the busy :00 slot)
  workflow_dispatch:          # "Run workflow" button for manual readings

permissions:
  contents: write

concurrency:
  group: doom-reading
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Take a doom reading
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/update_doom.py
      - name: Save the new reading
        run: |
          git config user.name "doom-meter-bot"
          git config user.email "doom-meter-bot@users.noreply.github.com"
          # Always save onto the latest main, even for re-runs of older commits
          cp data/doom.json "$RUNNER_TEMP/doom.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/doom.json" data/doom.json
          git add data/doom.json
          git diff --cached --quiet && { echo "No change to save."; exit 0; }
          git commit -m "Doom reading $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
