name: Update Doom Index

on:
  schedule:
    # Three tries per hour: GitHub sometimes skips scheduled runs when busy.
    # The script skips if a reading less than 40 minutes old already exists.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:          # "Run workflow" button for manual readings

permissions:
  contents: write

concurrency:
  group: doom-reading
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image library
        run: pip install --quiet pillow
      - name: Take a doom reading
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DOOM_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_doom.py
      - name: Save the new reading
        run: |
          git config user.name "doom-meter-bot"
          git config user.email "doom-meter-bot@users.noreply.github.com"
          # Always save onto the latest main, even for re-runs of older commits
          mkdir -p "$RUNNER_TEMP/out" && cp -r data share "$RUNNER_TEMP/out/" 2>/dev/null || true
          git stash --include-untracked --quiet || true
          git fetch origin main
          git checkout -B main origin/main
          rm -rf data/cards share
          cp -r "$RUNNER_TEMP/out/." .
          git add -A data share
          git diff --cached --quiet && { echo "No change to save."; exit 0; }
          git commit -m "Doom reading $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
